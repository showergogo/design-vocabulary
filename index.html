<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Vocabulary — Topinspo</title>
  <meta name="description" content="A working vocabulary of interface design: padding, gap, hierarchy, motion and more." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%235b6f00'/%3E%3Cpath d='M5.6 7.5H18.4M12 6.2V19' fill='none' stroke='%23fcfcf8' stroke-width='2.6'/%3E%3C/svg%3E" />
  <script>
    try {
      if (localStorage.getItem('design-vocab-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Roboto+Serif:opsz,wght@8..144,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="site-sidebar">
      <nav aria-label="Primary navigation" class="site-nav">
        <button type="button" aria-current="page" data-i18n="navVocab">Design Vocabulary</button>
        <button type="button" data-i18n="navSkills">Design Skills</button>
      </nav>
    </aside>

    <main class="site-main">
      <div class="feed-panel">
        <section aria-label="Design vocabulary" class="vocab-page">
          <header class="feed-heading">
            <h1 data-i18n="title">Design Vocabulary</h1>
            <div class="page-header-actions">
              <button type="button" class="focus-ring icon-switch" id="themeSwitch" aria-label="Switch to dark appearance" title="Switch to dark appearance">
                <svg class="icon-moon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M13.2 9.7A5.6 5.6 0 0 1 6.3 2.8a5.6 5.6 0 1 0 6.9 6.9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
                </svg>
                <svg class="icon-sun" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"></circle>
                  <path d="M8 1.4v1.4M8 13.2v1.4M1.4 8h1.4M13.2 8h1.4M3.3 3.3l1 1M11.7 11.7l1 1M12.7 3.3l-1 1M4.3 11.7l-1 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
                </svg>
              </button>
              <button type="button" class="focus-ring icon-switch" aria-label="切换到中文" title="切换到中文" id="langSwitch">中</button>
            </div>
          </header>

          <div class="vocab-toolbar">
            <div class="vocab-feels-bar" role="group" aria-label="Jump to terms by design issue">
              <span class="vocab-feels-label" data-i18n="jumpTo">Jump to</span>
            </div>
            <div class="vocab-search" id="searchBox">
              <svg viewBox="0 0 16 16" class="vocab-search-icon" fill="none" aria-hidden="true">
                <circle cx="7.25" cy="7.25" r="4.5" stroke="currentColor" stroke-width="1.35"></circle>
                <path d="M10.8 10.8 13.5 13.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"></path>
              </svg>
              <input type="text" id="searchInput" placeholder="Filter terms…" aria-label="Filter design terms" class="vocab-search-input" autocomplete="off" spellcheck="false" />
              <kbd class="vocab-search-kbd" aria-hidden="true">/</kbd>
            </div>
          </div>

          <div class="vocab-workspace">
            <div class="vocab-index-wrap">
              <div class="vocab-fade vocab-fade--top" aria-hidden="true"></div>
              <nav aria-label="Design terms list" class="vocab-index">
                <div class="vocab-index-list" id="termIndex"></div>
              </nav>
              <div class="vocab-fade vocab-fade--bottom" aria-hidden="true"></div>
            </div>
            <div class="vocab-detail" id="detail" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
